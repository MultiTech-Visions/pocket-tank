# PocketTankUpgrade.exe - the Windows double-click upgrader, built on every
# push to main that changes the firmware or the shared tank code.
#
# Job 1 builds the firmware with the same ESP-IDF the project uses and runs
# tools/win_upgrade/collect.py, which copies the three images an upgrade
# writes and REFUSES to continue if any of them could reach the nvs (saved
# tank) or model partitions. Job 2 bundles those images, esptool and
# tools/win_upgrade/pocket_tank_upgrade.py into one .exe with PyInstaller and
# attaches it to a fixed release, so the download link never changes.
#
# The exe is unsigned, so Windows SmartScreen shows a blue warning on first
# run: "More info" then "Run anyway". Signing it needs a paid certificate.
name: windows-upgrader

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "common/**"
      - "tools/win_upgrade/**"
      - ".github/workflows/win-upgrader.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-upgrader
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # git describe wants the tags
      - name: Build the firmware (ESP-IDF v5.4.1, esp32s3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          path: firmware
      - name: Collect the images, and prove they cannot reach the save
        run: python3 tools/win_upgrade/collect.py --build-dir firmware/build --out payload
      - uses: actions/upload-artifact@v4
        with:
          name: upgrader-payload
          path: payload
          retention-days: 7

  exe:
    needs: firmware
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: upgrader-payload
          path: payload
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the flasher and the bundler
        run: pip install "esptool==4.8.1" "pyinstaller==6.11.1"
      - name: Build PocketTankUpgrade.exe
        shell: bash
        run: |
          pyinstaller --onefile --console --clean \
            --name PocketTankUpgrade \
            --add-data "payload/bootloader.bin;." \
            --add-data "payload/partition-table.bin;." \
            --add-data "payload/pocket_tank.bin;." \
            --add-data "payload/flash.json;." \
            tools/win_upgrade/pocket_tank_upgrade.py
          ls -la dist
      - name: Check the exe actually starts and can read its payload
        shell: bash
        run: |
          # no board attached here, so it must fail at the PORT, not earlier:
          # anything about a missing bundled file means the packing is wrong
          set +e
          out=$(./dist/PocketTankUpgrade.exe COM_NOT_A_PORT 2>&1)
          set -e
          echo "$out"
          echo "$out" | grep -q "POCKET TANK" || { echo "the exe did not start"; exit 1; }
          echo "$out" | grep -qi "missing from the exe" && { echo "a bundled file is missing"; exit 1; }
          echo "exe starts and found its payload"
      - uses: actions/upload-artifact@v4
        with:
          name: PocketTankUpgrade
          path: dist/PocketTankUpgrade.exe
      - name: Attach it to the release people download from
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=windows-upgrader
          NOTES=$(cat <<'EOF'
          **Download `PocketTankUpgrade.exe` below, plug the tank in, double-click it.**

          It replaces the app only. Your fish, their names, your sand dollars and
          everything the shop sold are kept, and the model partition is left alone.

          Windows shows a blue SmartScreen warning the first time because the exe is
          not signed: click **More info**, then **Run anyway**.

          If several COM ports confuse it, run it with the right one:
          `PocketTankUpgrade.exe COM7`

          First install on a brand-new board needs the model partition too, which this
          does not carry - use the browser installer for that.
          EOF
          )
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Pocket Tank - Windows upgrader" --notes "$NOTES"
          else
            gh release edit "$TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/PocketTankUpgrade.exe --clobber
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/PocketTankUpgrade.exe"
